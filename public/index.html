<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTube Backend API Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 25, 41, 0.7);
      --bg-card-hover: rgba(28, 38, 61, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --badge-post: #10b981;
      --badge-get: #3b82f6;
      --badge-patch: #f59e0b;
      --badge-delete: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-rose), var(--accent-purple));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.3);
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 9999px;
      color: var(--accent-emerald);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Quick Info Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      word-break: break-all;
    }

    /* Modules Section */
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Filter Tabs */
    .tabs-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.55rem 1.2rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border-color: var(--accent-purple);
      color: #ffffff;
      font-weight: 600;
    }

    /* Routes Grid */
    .routes-grid {
      display: grid;
      gap: 1rem;
    }

    .route-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.25 ease;
    }

    .route-card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .route-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .route-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .method-badge {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .method-post { background: rgba(16, 185, 129, 0.15); color: var(--badge-post); border: 1px solid rgba(16, 185, 129, 0.3); }
    .method-get { background: rgba(59, 130, 246, 0.15); color: var(--badge-get); border: 1px solid rgba(59, 130, 246, 0.3); }
    .method-patch { background: rgba(245, 158, 11, 0.15); color: var(--badge-patch); border: 1px solid rgba(245, 158, 11, 0.3); }
    .method-delete { background: rgba(239, 68, 68, 0.15); color: var(--badge-delete); border: 1px solid rgba(239, 68, 68, 0.3); }

    .route-path {
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
    }

    .route-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .route-tags {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag-auth { background: rgba(244, 63, 94, 0.12); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.25); }
    .tag-public { background: rgba(6, 182, 212, 0.12); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.25); }

    /* Try out panel */
    .route-body {
      display: none;
      padding: 1.25rem;
      border-top: 1px solid var(--border-color);
      background: rgba(10, 15, 26, 0.6);
    }

    .route-card.open .route-body {
      display: block;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .btn-test {
      background: linear-gradient(135deg, var(--accent-purple), #6366f1);
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-test:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .response-box {
      background: #060911;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.825rem;
      color: #a7f3d0;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    footer {
      text-align: center;
      padding: 3rem 0 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="brand-title">
          <h1>iTube API Explorer</h1>
          <p>Production Ready Node.js & Express Video Platform Backend</p>
        </div>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        Backend Online (Port 8000)
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">API Base Path</div>
        <div class="stat-value" style="color: var(--accent-cyan);">/api/v1</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Registered Modules</div>
        <div class="stat-value">7 Services</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Database Name</div>
        <div class="stat-value" style="color: var(--accent-purple);">videotube</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Server Status</div>
        <div class="stat-value" id="health-status" style="color: var(--accent-emerald);">200 OK</div>
      </div>
    </div>

    <!-- API Routes Explorer -->
    <div class="section-title">
      <span>API Endpoint Documentation</span>
    </div>

    <!-- Category Filter Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="filterCategory('all', this)">All Endpoints</button>
      <button class="tab-btn" onclick="filterCategory('users', this)">Users</button>
      <button class="tab-btn" onclick="filterCategory('videos', this)">Videos</button>
      <button class="tab-btn" onclick="filterCategory('comments', this)">Comments</button>
      <button class="tab-btn" onclick="filterCategory('tweets', this)">Tweets</button>
      <button class="tab-btn" onclick="filterCategory('likes', this)">Likes</button>
      <button class="tab-btn" onclick="filterCategory('playlists', this)">Playlists</button>
      <button class="tab-btn" onclick="filterCategory('subscriptions', this)">Subscriptions</button>
    </div>

    <!-- Routes Container -->
    <div class="routes-grid" id="routes-list">
      <!-- Generated via JS below -->
    </div>

    <!-- Footer -->
    <footer>
      <p>iTube Backend • Built with Express.js, MongoDB, JWT & Cloudinary</p>
    </footer>
  </div>

  <script>
    const routes = [
      // Health Check
      { cat: 'all', method: 'GET', path: '/', auth: false, desc: 'Root health check endpoint', testable: true },

      // Users
      { cat: 'users', method: 'POST', path: '/api/v1/users/register', auth: false, desc: 'Register a new user (avatar & cover upload)', body: 'Multipart Form-Data' },
      { cat: 'users', method: 'POST', path: '/api/v1/users/login', auth: false, desc: 'User login with email/username & password' },
      { cat: 'users', method: 'POST', path: '/api/v1/users/logout', auth: true, desc: 'Logout current logged-in user' },
      { cat: 'users', method: 'POST', path: '/api/v1/users/refresh-token', auth: false, desc: 'Refresh Access & Refresh tokens' },
      { cat: 'users', method: 'GET', path: '/api/v1/users/current-user', auth: true, desc: 'Fetch profile of current authenticated user' },
      { cat: 'users', method: 'PATCH', path: '/api/v1/users/update-account', auth: true, desc: 'Update user fullName & email' },
      { cat: 'users', method: 'PATCH', path: '/api/v1/users/update-avatar', auth: true, desc: 'Update user avatar image file' },
      { cat: 'users', method: 'GET', path: '/api/v1/users/channel/:username', auth: true, desc: 'Get channel profile & subscriber count' },

      // Videos
      { cat: 'videos', method: 'GET', path: '/api/v1/videos', auth: true, desc: 'Fetch paginated videos list with query filters' },
      { cat: 'videos', method: 'POST', path: '/api/v1/videos/publish-video', auth: true, desc: 'Upload video file & thumbnail' },
      { cat: 'videos', method: 'GET', path: '/api/v1/videos/:videoId', auth: true, desc: 'Get details of a specific video by ID' },
      { cat: 'videos', method: 'PATCH', path: '/api/v1/videos/:videoId', auth: true, desc: 'Update video title & description' },
      { cat: 'videos', method: 'DELETE', path: '/api/v1/videos/:videoId', auth: true, desc: 'Delete video resource' },

      // Comments
      { cat: 'comments', method: 'GET', path: '/api/v1/comments/:videoId', auth: true, desc: 'Get all comments for a specific video' },
      { cat: 'comments', method: 'POST', path: '/api/v1/comments/:videoId', auth: true, desc: 'Add a new comment on a video' },

      // Tweets
      { cat: 'tweets', method: 'POST', path: '/api/v1/tweets', auth: true, desc: 'Create a new user tweet post' },
      { cat: 'tweets', method: 'GET', path: '/api/v1/tweets/user/:userId', auth: true, desc: 'Fetch tweets created by a specific user' },

      // Likes
      { cat: 'likes', method: 'POST', path: '/api/v1/likes/toggle/v/:videoId', auth: true, desc: 'Toggle like status on a video' },
      { cat: 'likes', method: 'GET', path: '/api/v1/likes/videos', auth: true, desc: 'Fetch all videos liked by current user' },

      // Playlists
      { cat: 'playlists', method: 'POST', path: '/api/v1/playlists', auth: true, desc: 'Create a new user video playlist' },
      { cat: 'playlists', method: 'GET', path: '/api/v1/playlists/user/:userId', auth: true, desc: 'Get playlists belonging to a user' },

      // Subscriptions
      { cat: 'subscriptions', method: 'POST', path: '/api/v1/subscriptions/c/:channelId', auth: true, desc: 'Toggle channel subscription' },
      { cat: 'subscriptions', method: 'GET', path: '/api/v1/subscriptions/c/:channelId', auth: true, desc: 'Get subscribers list for channel' }
    ];

    function renderRoutes(category = 'all') {
      const container = document.getElementById('routes-list');
      container.innerHTML = '';

      const filtered = category === 'all' 
        ? routes 
        : routes.filter(r => r.cat === category);

      filtered.forEach((r, idx) => {
        const card = document.createElement('div');
        card.className = 'route-card';

        const methodClass = `method-${r.method.toLowerCase()}`;
        const tagAuth = r.auth 
          ? `<span class="tag tag-auth">Auth Required</span>` 
          : `<span class="tag tag-public">Public</span>`;

        card.innerHTML = `
          <div class="route-header" onclick="toggleRoute(this)">
            <div class="route-meta">
              <span class="method-badge ${methodClass}">${r.method}</span>
              <span class="route-path">${r.path}</span>
            </div>
            <div class="route-tags">
              <span class="route-desc">${r.desc}</span>
              ${tagAuth}
            </div>
          </div>
          <div class="route-body">
            <div class="action-row">
              <button class="btn-test" onclick="executeTest('${r.path}', '${r.method}', this)">Try Out Endpoint</button>
            </div>
            <div class="response-box">Click "Try Out Endpoint" to send live request...</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleRoute(header) {
      const card = header.parentElement;
      card.classList.toggle('open');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderRoutes(cat);
    }

    async function executeTest(path, method, btn) {
      const responseBox = btn.closest('.route-body').querySelector('.response-box');
      responseBox.textContent = 'Sending request to server...';

      try {
        const res = await fetch(path, { method: method });
        const data = await res.json();
        responseBox.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        responseBox.textContent = `Error / Response Status:\n${err.message || err}`;
      }
    }

    // Initial Render
    renderRoutes();
  </script>
</body>
</html>
